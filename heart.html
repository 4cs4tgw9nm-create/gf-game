<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabie's Little Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Amiri:wght@700&display=swap">
<style>
/* Layout: one phone-sized storybook page. The little heart character lives in the middle,
   its words sit in a speech bubble above, and the one thing she can do sits underneath. */
:root {
  --cream: #fff6f1;
  --blush: #ffc7d6;
  --berry: #ff5c8a;
  --ink: #4a2b3a;
  --soft: #a07f8f;
  --mint: #a6dc8f;
  --card: #ffffff;
  --round: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--cream); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#floaties { position: fixed; inset: 0; pointer-events: none; }
#floaties span { position: absolute; bottom: -30px; color: var(--blush); animation: drift linear forwards; }
@keyframes drift { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }

main {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  max-width: 460px; margin: 0 auto;
}
.progress { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; display: flex; gap: 5px; }
.progress i { flex: 1; height: 5px; border-radius: 9px; background: rgba(255, 92, 138, .18); transition: background .4s; }
.progress i.on { background: var(--berry); }

.bubble {
  position: relative; width: 100%;
  background: var(--card); border-radius: 26px;
  padding: 18px 20px; text-align: center;
  box-shadow: 0 10px 30px rgba(255, 92, 138, .15);
  font: 600 clamp(19px, 5.2vw, 22px)/1.35 var(--round);
  min-height: 92px; display: grid; place-items: center;
  animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
  border: 13px solid transparent; border-top-color: var(--card); border-bottom: 0;
}
.bubble small { display: block; font: 700 13px var(--body); color: var(--soft); letter-spacing: .06em; margin-top: 6px; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

.stage { position: relative; width: min(64vw, 260px); aspect-ratio: 200 / 185; max-width: 100%; touch-action: none; cursor: pointer; }
.stage svg { width: 100%; height: 100%; overflow: visible; display: block; }
#body { transition: fill .5s ease; }
.breathe { transform-origin: 50% 90%; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04, .97); } }
.wiggle { animation: wiggle .5s ease; }
@keyframes wiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.steam circle { fill: #c9e8bb; animation: steam 1.4s ease-out infinite; }
.steam circle:nth-child(2) { animation-delay: .45s; }
.steam circle:nth-child(3) { animation-delay: .9s; }
@keyframes steam { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-26px); opacity: 0; } }
.zz { font: 700 22px var(--round); fill: var(--soft); animation: steam 2s ease-out infinite; }

.actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 120px; }
.btn {
  border: 0; border-radius: 99px; cursor: pointer;
  padding: 15px 30px; min-width: 200px;
  background: var(--berry); color: #fff;
  font: 700 18px var(--round);
  box-shadow: 0 6px 0 #d63d6c, 0 12px 24px rgba(255, 92, 138, .3);
  transition: transform .12s ease;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d63d6c; }
.btn.soft { background: var(--card); color: var(--ink); box-shadow: 0 6px 0 var(--blush); }
.btn:focus-visible, .promise:focus-visible, .stage:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.hint { font: 700 14px var(--body); color: var(--soft); text-align: center; }
.meter { width: 70%; height: 14px; border-radius: 99px; background: rgba(166, 220, 143, .35); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--berry)); border-radius: inherit; transition: width .15s; }

.promises { width: 100%; display: grid; gap: 10px; }
.promise {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  text-align: left; width: 100%; cursor: pointer;
  background: var(--card); border: 2px dashed var(--blush); border-radius: 18px;
  padding: 12px 14px; color: var(--ink); font: 700 15px/1.35 var(--body);
}
.promise .seal {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  border: 2px dashed var(--blush); color: var(--blush); font-size: 20px; transition: all .3s;
}
.promise.sealed { border-style: solid; border-color: var(--berry); }
.promise.sealed .seal { border-style: solid; background: var(--berry); border-color: var(--berry); color: #fff; transform: rotate(-12deg) scale(1.08); }

/* finale */
.finale { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto; max-height: 100%; padding-block: 8px; }
.polaroid { width: min(56%, 200px); margin: 0; padding: 9px 9px 34px; background: #fff; transform: rotate(-3deg); box-shadow: 0 14px 30px rgba(74, 43, 58, .2); position: relative; }
.polaroid img { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.polaroid figcaption { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font: 600 15px var(--round); }
.arabic { font-family: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif; font-size: 28px; color: var(--berry); direction: rtl; line-height: 1.3; }
.letter { background: var(--card); border-radius: 22px; padding: 18px 18px 16px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(255, 92, 138, .12); font-weight: 700; font-size: 16px; }
.letter .sign { font: 700 22px var(--round); color: var(--berry); text-align: right; }

@media (prefers-reduced-motion: reduce) {
  .breathe, .steam circle, .zz, #floaties span, .bubble { animation: none !important; }
}
</style>
</head>
<body>
<div id="floaties" aria-hidden="true"></div>
<main>
  <div class="progress" id="progress"></div>
  <div class="bubble" id="bubble" aria-live="polite"></div>
  <div class="stage" id="stage" tabindex="0" aria-label="Rabie's little heart. Tap or rub it.">
    <svg viewBox="0 0 200 185" aria-hidden="true">
      <g id="heart" class="breathe">
        <path id="body" d="M100 172 C40 128 8 98 8 60 C8 30 33 9 60 9 C79 9 93 20 100 36 C107 20 121 9 140 9 C167 9 192 30 192 60 C192 98 160 128 100 172Z" fill="#ffb3c6"/>
        <ellipse cx="72" cy="40" rx="16" ry="9" fill="#fff" opacity=".35" transform="rotate(-25 72 40)"/>
        <g id="face"></g>
      </g>
      <g id="extras"></g>
    </svg>
  </div>
  <div class="actions" id="actions"></div>
</main>

<script>
/* ============================================================
   EDIT HERE: every word she reads
   ============================================================ */
const NAME = "Kounouz", FROM = "Rabie", PHOTO = "assets/kounouz.jpg";
const SCENES = [
  { mood: "sleep", say: "Psst… someone is hiding here. Tap to wake him up.", act: "tap" },
  { mood: "shy", say: `Hi ${NAME}… I'm Rabie's heart. I'm small and a little silly sometimes.`, act: "next", btn: "Hi little heart" },
  { mood: "sad", say: "I came to say sorry for our fight. I've felt so bad ever since.", act: "next", btn: "What happened?" },
  { mood: "jealous", say: "During the fight I turned all grumpy and green like this. Grrr. I talked too fast and too loud.", act: "next", btn: "Why?" },
  { mood: "jealous", say: "Not because I love you less. Because I love you so much that I got scared, and I forgot to be gentle.", act: "next", btn: "Oh…" },
  { mood: "jealous", say: "Can you help me calm down? Rub me or tap me until I'm pink again.", act: "pet" },
  { mood: "happy", say: "Ahh, much better. Only you can do that to me.", act: "next", btn: "You're welcome ♥" },
  { mood: "think", say: "While I was green, I learned something important.", act: "next", btn: "What?" },
  { mood: "think", say: "Being right means nothing if you're sad. I'd rather lose every argument than lose your smile.", act: "next", btn: "Really?" },
  { mood: "sad", say: "Really. And I'm sorry for how I talked to you. You deserved softness, not a fight.", act: "choice" },
  { mood: "happy", say: "I made you three promises. Tap each one to seal it with a kiss.", act: "promises" },
  { mood: "love", act: "final" }
];
const FORGIVE_YES = "Thank you, Kounouz. I'll be the best little heart. Promise.";
const FORGIVE_TIME = "That's okay. Take all the time you need. I'll be right here, still loving you.";
const PROMISES = [
  "Next time we disagree, I'll listen to you first and talk calmly.",
  "We never go to sleep angry. A hug always comes before being right.",
  "You and me against the problem. Never against each other."
];
const LETTER = [
  `${NAME}, I'm sorry for our fight. I love you so much that sometimes my heart gets scared and acts silly.`,
  "You deserve to always feel safe, heard and loved with me. That's what I want to give you, every day.",
  "Thank you for being patient with me. You are my treasure, kanouzti. Nhebbek barcha."
];
/* ============================================================ */

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let idx = 0, calm = 0;

/* ---------- the heart's faces ---------- */
const EYES_OPEN = `<ellipse cx="74" cy="78" rx="9" ry="11" fill="#4a2b3a"/><ellipse cx="126" cy="78" rx="9" ry="11" fill="#4a2b3a"/><circle cx="77" cy="74" r="3.5" fill="#fff"/><circle cx="129" cy="74" r="3.5" fill="#fff"/>`;
const EYES_CLOSED = `<path d="M64 80 Q74 70 84 80" stroke="#4a2b3a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M116 80 Q126 70 136 80" stroke="#4a2b3a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
const EYES_SLEEP = `<path d="M64 76 Q74 84 84 76" stroke="#4a2b3a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M116 76 Q126 84 136 76" stroke="#4a2b3a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
const BLUSH = o => `<ellipse cx="58" cy="100" rx="12" ry="7" fill="#ff7fa3" opacity="${o}"/><ellipse cx="142" cy="100" rx="12" ry="7" fill="#ff7fa3" opacity="${o}"/>`;
const FACES = {
  sleep: EYES_SLEEP + BLUSH(.4) + `<path d="M92 106 Q100 111 108 106" stroke="#4a2b3a" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  shy: EYES_OPEN + BLUSH(.85) + `<path d="M90 104 Q100 112 110 104" stroke="#4a2b3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  sad: EYES_OPEN + BLUSH(.5) + `<path d="M88 112 Q100 102 112 112" stroke="#4a2b3a" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M66 93 q-4 9 0 12 q4 -3 0 -12z" fill="#7cc6f2"/>`,
  jealous: `<path d="M62 66 L86 72" stroke="#4a2b3a" stroke-width="5" stroke-linecap="round"/><path d="M138 66 L114 72" stroke="#4a2b3a" stroke-width="5" stroke-linecap="round"/>` + `<ellipse cx="74" cy="82" rx="8" ry="8" fill="#4a2b3a"/><ellipse cx="126" cy="82" rx="8" ry="8" fill="#4a2b3a"/>` + `<path d="M86 108 q7 -6 14 0 q7 6 14 0" stroke="#4a2b3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  happy: EYES_CLOSED + BLUSH(.9) + `<path d="M84 100 Q100 122 116 100 Z" fill="#4a2b3a"/><path d="M92 108 Q100 116 108 108 Z" fill="#ff7fa3"/>`,
  think: EYES_OPEN + BLUSH(.5) + `<circle cx="100" cy="108" r="5" fill="#4a2b3a"/>`,
  love: `<path d="M74 70 c-6 -8 -18 -2 -12 8 l12 12 l12 -12 c6 -10 -6 -16 -12 -8z" fill="#ff3d73"/><path d="M126 70 c-6 -8 -18 -2 -12 8 l12 12 l12 -12 c6 -10 -6 -16 -12 -8z" fill="#ff3d73"/>` + BLUSH(.9) + `<path d="M84 102 Q100 122 116 102 Z" fill="#4a2b3a"/>`
};
const PINK = [255, 179, 198], GREEN = [166, 220, 143];
function tint(t) { // 0 = green, 1 = pink
  const c = GREEN.map((g, i) => Math.round(g + (PINK[i] - g) * t));
  $("body").setAttribute("fill", `rgb(${c})`);
}
function setMood(m) {
  $("face").innerHTML = FACES[m];
  const ex = $("extras");
  if (m === "jealous") { ex.innerHTML = `<g class="steam"><circle cx="40" cy="20" r="9"/><circle cx="160" cy="18" r="8"/><circle cx="100" cy="2" r="7"/></g>`; tint(calm); }
  else if (m === "sleep") { ex.innerHTML = `<text class="zz" x="160" y="20">z</text>`; tint(1); }
  else if (m === "sad") { ex.innerHTML = `<g transform="rotate(30 158 40)"><rect x="140" y="32" width="38" height="14" rx="7" fill="#f6d2a8"/><rect x="153" y="32" width="12" height="14" fill="#efc08c"/></g>`; tint(1); }
  else { ex.innerHTML = ""; tint(1); }
  wiggle();
}
function wiggle() {
  const h = $("heart"); if (reduceMotion) return;
  h.classList.remove("wiggle"); void h.getBBox(); h.classList.add("wiggle");
  setTimeout(() => h.classList.remove("wiggle"), 500);
}

/* ---------- little sounds ---------- */
let audio = null;
function sound(freqs, type = "sine", vol = .08) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch (e) { return; }
  const now = audio.currentTime;
  freqs.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + i * .08); g.gain.linearRampToValueAtTime(vol, now + i * .08 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, now + i * .08 + .5);
    o.connect(g).connect(audio.destination); o.start(now + i * .08); o.stop(now + i * .08 + .55);
  });
}
const boop = () => sound([660 + Math.random() * 200], "sine", .06);

/* ---------- floating hearts ---------- */
function floaty(n = 1, big) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.textContent = "♥";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = (big ? 18 + Math.random() * 26 : 10 + Math.random() * 14) + "px";
    s.style.animationDuration = (big ? 3 : 7) + Math.random() * 4 + "s";
    if (big) s.style.color = Math.random() < .5 ? "#ff5c8a" : "#ffc7d6";
    $("floaties").appendChild(s);
    setTimeout(() => s.remove(), 12000);
  }
}
setInterval(() => floaty(1), 1400);

/* ---------- scenes ---------- */
function bubble(text, small) {
  const b = $("bubble");
  b.hidden = !text;
  b.innerHTML = ""; b.textContent = text || "";
  if (small) { const s = document.createElement("small"); s.textContent = small; b.appendChild(s); }
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
}
function button(label, onClick, soft) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn" + (soft ? " soft" : ""); b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function next() { boop(); show(idx + 1); }
function renderProgress() {
  $("progress").replaceChildren(...SCENES.map((_, i) => { const d = document.createElement("i"); if (i <= idx) d.className = "on"; return d; }));
}

let stageHandler = null;
$("stage").addEventListener("pointerdown", e => stageHandler?.(e, "down"));
$("stage").addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "mouse") stageHandler?.(e, "move"); });
$("stage").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); stageHandler?.(e, "down"); } });

function show(i) {
  idx = i; const sc = SCENES[i];
  renderProgress();
  const act = $("actions"); act.replaceChildren();
  stageHandler = (e, kind) => { if (kind === "down") { wiggle(); boop(); floaty(2, true); } };
  $("stage").hidden = false;
  if (sc.act === "final") return finale();
  if (sc.mood === "jealous" && sc.act !== "pet") calm = 0;
  setMood(sc.mood);
  bubble(sc.say);

  if (sc.act === "tap") {
    const h = document.createElement("div"); h.className = "hint"; h.textContent = "tap the little heart";
    act.append(h);
    stageHandler = (e, kind) => { if (kind === "down") { sound([523, 784]); next(); } };
  }
  if (sc.act === "next") act.append(button(sc.btn, next));
  if (sc.act === "pet") {
    calm = 0; tint(0);
    const meter = document.createElement("div"); meter.className = "meter"; meter.innerHTML = "<i></i>";
    const h = document.createElement("div"); h.className = "hint"; h.textContent = "rub or tap the heart";
    act.append(meter, h);
    let lastBoop = 0;
    stageHandler = (e, kind) => {
      if (calm >= 1) return;
      calm = Math.min(1, calm + (kind === "down" ? .09 : .012));
      tint(calm); meter.firstChild.style.width = calm * 100 + "%";
      const now = performance.now();
      if (now - lastBoop > 160) { lastBoop = now; boop(); floaty(1, true); }
      if (calm > .55) { $("face").innerHTML = FACES.shy; $("extras").innerHTML = ""; }
      if (calm >= 1) {
        h.textContent = "all pink again ♥";
        sound([523, 659, 784, 1047]); floaty(10, true);
        setTimeout(next, 900);
      }
    };
  }
  if (sc.act === "choice") {
    act.append(
      button("I forgive you ♥", () => { sound([523, 659, 784, 1047]); floaty(14, true); setMood("love"); bubble(FORGIVE_YES); act.replaceChildren(button("Continue", next)); }),
      button("I need a little time", () => { setMood("shy"); bubble(FORGIVE_TIME); act.replaceChildren(button("Continue", next)); }, true)
    );
  }
  if (sc.act === "promises") {
    const list = document.createElement("div"); list.className = "promises";
    let sealed = 0;
    const done = button("See my letter ♥", next); done.hidden = true;
    PROMISES.forEach(text => {
      const p = document.createElement("button"); p.type = "button"; p.className = "promise";
      p.innerHTML = `<span></span><span class="seal" aria-hidden="true">♥</span>`;
      p.firstChild.textContent = text;
      p.setAttribute("aria-pressed", "false");
      p.addEventListener("click", () => {
        if (p.classList.contains("sealed")) return;
        p.classList.add("sealed"); p.setAttribute("aria-pressed", "true");
        sealed++; sound([784, 1047]); floaty(4, true); wiggle();
        if (sealed === PROMISES.length) { setMood("love"); done.hidden = false; done.focus({ preventScroll: true }); }
      });
      list.append(p);
    });
    $("stage").hidden = true;
    act.append(list, done);
  }
}

function finale() {
  sound([523, 659, 784, 1047, 1319]); floaty(20, true);
  $("stage").hidden = true; bubble("");
  const f = document.createElement("div"); f.className = "finale";
  f.innerHTML = `
    <div class="arabic">سامحني يا كنوزتي</div>
    <figure class="polaroid"><img alt="Kounouz smiling"><figcaption>my favorite person</figcaption></figure>
    <div class="letter"></div>`;
  f.querySelector("img").src = PHOTO;
  const letter = f.querySelector(".letter");
  LETTER.forEach(t => { const p = document.createElement("p"); p.style.margin = "0"; p.textContent = t; letter.append(p); });
  const sign = document.createElement("div"); sign.className = "sign"; sign.textContent = "♥ " + FROM; letter.append(sign);
  const hug = button("Send Rabie a hug", () => { sound([659, 880, 1175]); floaty(30, true); hug.textContent = "Hug sent. He owes you a real one ♥"; });
  const again = button("Read it again", () => show(0), true);
  f.append(hug, again);
  $("actions").replaceChildren(f);
}

show(0);
</script>
</body>
</html>
